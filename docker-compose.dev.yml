# Dev infrastructure only: `pnpm dev:infra`. The apps run on the host (`pnpm dev`); the full stack is docker-compose.yml.
# Same project name, service names and volume as docker-compose.yml, so both files share the same data and ports.
name: mono-one

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment: { POSTGRES_PASSWORD: pg, POSTGRES_USER: postgres }
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ['5432:5432']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U postgres'],
        interval: 2s,
        timeout: 3s,
        retries: 30
      }

  redis: # JWT storage for the BFF only
    image: redis:8.8.3-alpine3.23
    ports: ['6379:6379']
    healthcheck:
      {
        test: ['CMD', 'redis-cli', 'ping'],
        interval: 2s,
        timeout: 3s,
        retries: 30
      }

volumes:
  pgdata:
